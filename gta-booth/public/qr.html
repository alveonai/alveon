<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR za štand</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #111; text-align: center; }
    .sheet { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 56px; font-style: italic; font-weight: 900; text-transform: uppercase; margin: 0; line-height: .95; }
    .lead { font-size: 24px; margin: 14px 0 26px; }
    #qr { display: inline-block; padding: 18px; border: 6px solid #111; border-radius: 18px; }
    #qr img, #qr canvas { width: 360px !important; height: 360px !important; }
    .url { margin-top: 14px; font-size: 18px; word-break: break-all; }
    .age { display: inline-block; margin-top: 22px; font-size: 28px; font-weight: 900; border: 4px solid #111; border-radius: 50%; width: 84px; height: 84px; line-height: 76px; }
    .hint { color: #555; margin-top: 18px; }
    @media print { .noprint { display: none; } }
  </style>
</head>
<body>
  <div class="sheet">
    <h1>Uđi u igru</h1>
    <p class="lead">Skeniraj, slikaj se i postani lik iz video igre.</p>
    <div id="qr"></div>
    <div class="url" id="url"></div>
    <div class="age">18+</div>
    <p class="hint noprint">Odštampaj ovu stranicu (Ctrl+P / Cmd+P) i postavi je na štand.</p>
  </div>
  <script>
    const target = location.origin + '/';
    document.getElementById('url').textContent = target.replace(/^https?:\/\//, '');
    if (window.QRCode) {
      new QRCode(document.getElementById('qr'), { text: target, width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M });
    } else {
      document.getElementById('qr').textContent = 'QR biblioteka nije učitana – proveri internet.';
    }
  </script>
</body>
</html>
