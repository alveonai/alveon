name = "gta-booth"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Statični fajlovi (stranica za goste, tablet, privatnost).
# /api/* uvek ide na Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Baza: sesije, statusi, brojač generacija.
# Napravljena 17. 11. 2026 (`wrangler d1 create gta-booth-db --location eeur`).
[[d1_databases]]
binding = "DB"
database_name = "gta-booth-db"
database_id = "7f34585f-a2dc-49f9-a04f-399ee5a3a57f"

# Skladište slika (originali i rezultati).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "gta-booth-photos"

# Red za generisanje: approve samo upiše posao, a generisanje radi consumer
# nezavisno od veze tableta/telefona. max_concurrency ograničava paralelne
# pozive ka Google-u (zaštita od 429).
[[queues.producers]]
binding = "JOBS"
queue = "gta-booth-jobs"

[[queues.consumers]]
queue = "gta-booth-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 10
max_concurrency = 3

# Čišćenje na svakih 5 minuta: istekli zahtevi, originali, stare slike.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# "gemini" = pravo generisanje preko Google Gemini API-ja (postavljena aplikacija, event).
# "mock" = demo režim (vraća originalnu sliku, ne troši ništa).
# Lokalno `npm run dev` / `dev:lan` uvek idu u demo (--var PROVIDER:mock), `dev:live` u pravi režim.
PROVIDER = "gemini"
GEMINI_MODEL = "gemini-nano-banana-2.1"
# 4K: ~8 MB po slici, generisanje 30–50 s (test 17. 11.). Odluka agencije 17. 11. 2026 (slike idu i na štampu).
IMAGE_SIZE = "4K"
# Format izlazne slike je format izabrane scene (src/scenes.js); bez scene format
# ulazne fotografije, a ASPECT_RATIO samo ako ni on nije poznat.
ASPECT_RATIO = "3:4"

# Limit generacija po danu (vreme po Beogradu). Ponuda: do 400 slika + rezerva za
# ponovne pokušaje (odluka agencije 17. 11. 2026). Najviše ~$51 dnevno u 4K.
DAILY_LIMIT = "450"
# Cena po slici u USD (Nano Banana 2.1, 4K; 2K je 0.0504) – samo za prikaz na tabletu.
COST_PER_IMAGE_USD = "0.113"
# Koliko pokušaja generisanja po gostu (1 + 1 automatski ponovni).
MAX_ATTEMPTS = "2"

# Pauze (s) pri preopterećenju Google-a (429/503); ne troše pokušaj.
TRANSIENT_DELAYS_S = "5,15,30,60"

# Kućica "pristanak za objavu na mrežama". "0" = isključeno (nema toka za
# preuzimanje i dugoročno čuvanje dokaza o pristanku). Vidi PLAN.md, 3.7.
SOCIAL_CONSENT_ENABLED = "0"

# Najviše zahteva koji istovremeno čekaju odobrenje.
MAX_PENDING = "40"
# Neodobrene slike se brišu posle ovoliko minuta.
PENDING_TTL_MIN = "15"
# Original se briše ovoliko minuta posle uspešnog generisanja.
ORIGINAL_TTL_MIN = "60"
# Rezultati i svi podaci se brišu posle ovoliko dana.
RETENTION_DAYS = "7"

# Podaci za obaveštenje o privatnosti (rukovalac kako je registrovan u APR-u).
CONTROLLER_NAME = "Petar Popović PR Beograd (Alveon)"
CONTACT_EMAIL = "info@alveonai.com"

# Demo režim: koliko traje "generisanje".
MOCK_DELAY_MS = "4000"

# Tajne (NE upisivati ovde), postavljaju se komandom:
#   npx wrangler secret put ADMIN_PIN
#   npx wrangler secret put GEMINI_API_KEY
# Za lokalni rad: fajl .dev.vars (vidi .dev.vars.example).
